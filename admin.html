<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理面板 — Rocket 雪茄房</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo"><span>🚀</span> <span data-i18n="site_name">Rocket 雪茄房</span></div>
    <nav>
      <a href="index.html" data-i18n="nav_home">首页</a>
      <a href="admin.html" class="active" data-i18n="nav_admin">管理</a>
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="es">ES</button>
      </div>
    </nav>
  </div>
</header>

<div class="password-screen" id="passwordScreen">
  <div class="password-box">
    <h2 data-i18n="pw_title">🔒 管理员登录</h2>
    <p data-i18n="pw_hint">请输入管理密码以进入后台</p>
    <div class="form-group">
      <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="checkPassword()" data-i18n="pw_btn">进入管理</button>
    <div class="error" id="passwordError"></div>
  </div>
</div>

<div id="adminMain" style="display:none">
  <div class="admin-wrap">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
      <h2 data-i18n="admin_title">📋 文章管理</h2>
      <div style="display:flex;gap:0.75rem">
        <button class="btn btn-primary" onclick="openModal()" data-i18n="btn_add">＋ 添加雪茄</button>
        <button class="btn btn-secondary btn-sm" onclick="logout()" data-i18n="btn_logout">退出登录</button>
      </div>
    </div>
    <div class="admin-post-list" id="adminList"></div>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="closeModalOnBg(event)">
  <div class="modal">
    <h3 id="modalTitle">添加新雪茄</h3>
    <input type="hidden" id="editId">

    <!-- 多语言内容标签 -->
    <div class="form-content-notice" data-i18n="form_content_notice">📝 以下字段可分三种语言填写</div>
    <div class="form-lang-tabs" id="formLangTabs">
      <button class="form-lang-tab active" data-form-lang="zh">🇨🇳 中文</button>
      <button class="form-lang-tab" data-form-lang="en">🇬🇧 English</button>
      <button class="form-lang-tab" data-form-lang="es">🇪🇸 Español</button>
    </div>

    <div class="form-group">
      <label data-i18n="lbl_art_title">标题 *</label>
      <input type="text" id="fTitle">
    </div>
    <div class="form-group">
      <label data-i18n="lbl_tags">标签（逗号分隔）</label>
      <input type="text" id="fTags">
    </div>
    <div class="form-group">
      <label data-i18n="lbl_body">雪茄简介 *</label>
      <textarea id="fBody" style="min-height:100px"></textarea>
    </div>
    <div class="form-group">
      <label data-i18n="lbl_notes">品鉴笔记</label>
      <textarea id="fNotes" style="min-height:130px"></textarea>
    </div>

    <hr style="border-color:var(--border);margin:1.25rem 0">

    <!-- 封面图片上传 -->
    <div class="form-group">
      <label data-i18n="lbl_cover">封面图片</label>
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
        <img id="coverPreview" style="display:none;width:100%;max-height:200px;object-fit:cover;border-radius:4px">
        <div id="uploadPlaceholder">
          <div style="font-size:2rem">📷</div>
          <div data-i18n="upload_btn" style="color:var(--gold);margin-top:0.5rem">上传照片</div>
          <div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.25rem">点击选择图片</div>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <div style="margin-top:0.5rem;font-size:0.8rem;color:var(--text-muted)" data-i18n="upload_or">或粘贴图片链接</div>
      <input type="text" id="fCover" placeholder="https://..." style="margin-top:0.4rem">
    </div>

    <!-- 共用字段 -->
    <div class="form-row">
      <div class="form-group">
        <label data-i18n="lbl_brand">品牌</label>
        <input type="text" id="fBrand" data-i18n-placeholder="ph_brand">
      </div>
      <div class="form-group">
        <label data-i18n="lbl_origin">产地</label>
        <input type="text" id="fOrigin" data-i18n-placeholder="ph_origin">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label data-i18n="lbl_vitola">茄型</label>
        <input type="text" id="fVitola" data-i18n-placeholder="ph_vitola">
      </div>
      <div class="form-group">
        <label data-i18n="lbl_strength">口感强度</label>
        <select id="fStrength">
          <option value="清淡" data-i18n="strength_light">清淡</option>
          <option value="中等" data-i18n="strength_medium" selected>中等</option>
          <option value="浓郁" data-i18n="strength_full">浓郁</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label data-i18n="lbl_wrapper">茄衣</label>
        <input type="text" id="fWrapper" data-i18n-placeholder="ph_wrapper">
      </div>
      <div class="form-group">
        <label data-i18n="lbl_binder">茄套</label>
        <input type="text" id="fBinder" data-i18n-placeholder="ph_binder">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label data-i18n="lbl_filler">茄芯</label>
        <input type="text" id="fFiller" data-i18n-placeholder="ph_filler">
      </div>
      <div class="form-group">
        <label data-i18n="lbl_size">尺寸</label>
        <input type="text" id="fSize" data-i18n-placeholder="ph_size">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label data-i18n="lbl_price">价格</label>
        <input type="text" id="fPrice" data-i18n-placeholder="ph_price">
      </div>
      <div class="form-group">
        <label data-i18n="lbl_my_rating">博主评分 (0–100)</label>
        <input type="number" id="fMyRating" min="0" max="100" placeholder="0–100">
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-primary" onclick="savePost()" data-i18n="btn_save">💾 保存</button>
      <button class="btn btn-secondary" onclick="closeModal()" data-i18n="btn_cancel">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
