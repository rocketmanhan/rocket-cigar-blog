<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocket 雪茄房</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo"><span>🚀</span> <span data-i18n="site_name">Rocket 雪茄房</span></div>
    <nav>
      <a href="index.html" class="active" data-i18n="nav_home">首页</a>
      <a href="admin.html" data-i18n="nav_admin">管理</a>
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="es">ES</button>
      </div>
    </nav>
  </div>
</header>

<div class="hero">
  <h1 data-i18n="site_name">Rocket 雪茄房</h1>
  <p data-i18n="site_tagline">探索世界顶级雪茄 · 分享品鉴心得</p>
</div>

<div class="container">
  <div class="filter-bar">
    <input type="text" id="searchInput" data-i18n-placeholder="search_placeholder" placeholder="搜索雪茄名称、品牌...">
    <select id="filterStrength"></select>
    <select id="filterOrigin"></select>
  </div>

  <div class="post-grid" id="postGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="icon">🚬</div>
    <p data-i18n-html="empty_posts">暂无文章，请前往<a href="admin.html">管理面板</a>添加。</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
